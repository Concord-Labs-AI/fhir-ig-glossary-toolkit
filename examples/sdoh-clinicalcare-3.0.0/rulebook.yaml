- id: T-CP
  glossary_term: Coordination platform (CP) (aka community resource referral platform)
  definition: A technology platform that enables health care organizations to identify, search, and electronically
    refer patients to community-based social service organizations in order to address unmet social needs. Some
    community resource referral platforms also enable self-referral.
  acronym: CP
  rules:
  - id: R-CP-CANON
    type: canonical
    pattern: \b[Cc]oordination [Pp]latforms?\b|\bCPs?\b|\bcommunity resource referral platforms?\b
    case_sensitive: true
  - id: R-CP-CRP
    type: missed-use
    pattern: \bcommunity[\s-]+resource[\s-]+platforms?\b
    suggest: coordination platform (CP)
    note: 'Self-referral page''s name for the CP (glossary: aka community resource referral platform).'
  - id: R-CP-REFPLAT
    type: missed-use
    pattern: (?<!resource\s)\breferral\s+platforms?\b
    suggest: coordination platform (CP)
    note: Generic 'referral platform' for the glossary's coordination platform.
  - id: R-CP-ASORG
    type: misuse-signal
    pattern: \b(CPs?|coordination\s+platforms?)\b(?=[^.|]{0,40}\b(staff|decides?|contacts?|calls?|agrees?|employs?|works?\s+with)\b)
    note: 'Glossary: the CP is a system actor; organizational actions belong to the intermediary.'
  - id: R-CP-CASE
    type: form
    case_sensitive: true
    pattern: (?<=[a-z,;)]\s)Coordination Platforms?\b
    suggest: coordination platform
