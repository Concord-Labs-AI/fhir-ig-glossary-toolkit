    - artifact group name
    - IG title
    note: Glossary terms are sentence case mid-sentence.
- id: T-RISK
  glossary_term: Social risk
  definition: Adverse social conditions associated with poor health. (Equivalent to health-related social needs,
    or HRSN)
  rules:
  - id: R-RISK-CANON
    type: canonical
    pattern: \bsocial\s+risks?\b
  - id: R-RISK-HRSN
    type: missed-use
    pattern: (?<!AHC\s)\bHRSNs?\b
    case_sensitive: true
    suggest: social risk
    decision: D-4
    note: 'Glossary: social risk is equivalent to HRSN.'
  - id: R-RISK-HRSNLONG
    type: missed-use
    pattern: (?<!Communities\s)\bhealth[\s-]related\s+social\s+needs?\b
    suggest: social risk
    decision: D-4
  - id: R-RISK-PAIR
    type: misuse-signal
    pattern: \bsocial\s+risks?\s+and\s+needs?\b|\brisks?\s+and\s+needs?\b
    note: Pairing risk and need may be deliberate (both concepts) or a conflation.
  - id: R-RISK-CASE
    type: form
    case_sensitive: true
    pattern: (?<=[a-z,;)]\s)Social Risks?\b
    suggest: social risk
    skip_fields:
    - heading
    - page title
    - menu label
    - Title
    - caption
    - entity name
    - Id
    - concept display
    - diagram line
    - svg text
    - transcribed text
    - artifact group name
    - IG title
    note: Glossary terms are sentence case mid-sentence.
- id: T-SSO
  glossary_term: Social service organization
  definition: An organization within the social service sector that works to address fundamental human needs in
    the community and promote social well-being through provision of services. Social service organizations include
    both regulatory-administered and governed organizations and community-governed organizations.
  rules:
  - id: R-SSO-CANON
    type: canonical
    pattern: \bsocial\s+service\s+organi[sz]ations?\b
  - id: R-SSO-CBO
    type: missed-use
    pattern: \bCBOs?\b
    case_sensitive: true
    suggest: social service organization
    decision: D-6
    note: Generic referral-target use of CBO.
  - id: R-SSO-SVCSORG
    type: form
    pattern: \bsocial\s+services\s+organi[sz]ations?\b
    suggest: social service organization
  - id: R-SSO-CAREORG
    type: missed-use
    pattern: \bsocial\s+care\s+(organi[sz]ations?|providers?)\b|\bsocial\s+service\s+providers?\b
    suggest: social service organization
    decision: D-1
  - id: R-SSO-COMMORG
    type: missed-use
    pattern: \bcommunity\s+(organi[sz]ations?|partners?)\b
    suggest: social service organization
  - id: R-SSO-CASE
    type: form
    case_sensitive: true
    pattern: (?<=[a-z,;)]\s)Social Service Organi[sz]ations?\b
    suggest: social service organization
