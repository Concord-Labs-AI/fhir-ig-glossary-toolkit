- id: T-CLOSED
  glossary_term: Closed system
  definition: A system in which the referral source, intermediary, and referral target all use the same system or
    platform. In this environment, capacity status, if shared, is known without the need for a standards-based exchange.
    Closed systems are out of scope for this guide.
  rules:
