- id: T-INT
  glossary_term: Intermediary
  definition: An organizational actor that sits between a referral source and a referral target to facilitate and
    coordinate the referral (for example, a community care hub). It typically operates a coordination platform (CP)
    — the system actor that relays data between the source's and target's system actors — though some intermediaries
    instead coordinate referrals manually (e.g., by email or spreadsheet) rather than through a CP.
  rules:
  - id: R-INT-CANON
    type: canonical
    pattern: \bintermediar(y|ies)\b
  - id: R-INT-SYSTEM
    type: misuse-signal
    pattern: \bintermediar(y|ies)\b(?=[^.|]{0,60}\b(POSTs?|GETs?|PUTs?|quer(y|ies|ying)|subscri\w*|poll\w*|servers?|endpoints?|APIs?|clones?|proxies|creates?\s+(a\s+)?(Task|ServiceRequest)))
    note: 'Glossary: the intermediary is the organization; system actions (POST, query, subscribe, create Task)
      belong to its coordination platform.'
  - id: R-INT-CASE
    type: form
    case_sensitive: true
    pattern: (?<=[a-z,;)]\s)Intermediar(y|ies)\b
    suggest: intermediary
    skip_fields:
    - heading
    - page title
    - menu label
    - Title
    - caption
    - entity name
    - Id
    - concept display
    - diagram line
    - svg text
    - transcribed text
    - artifact group name
    - IG title
    note: Glossary terms are sentence case mid-sentence.
- id: T-OPEN
  glossary_term: Open system
  definition: A system in which the referral source, intermediary, and referral target each use disparate systems
    that cannot natively interoperate. To share information like capacity status, an agreed-upon exchange method
    (e.g., FHIR) is required. Open systems are in scope for this guide.
  rules:
  - id: R-OPEN-CANON
    type: canonical
    pattern: \bopen\s+systems?\b
  - id: R-OPEN-CASE
    type: form
    case_sensitive: true
    pattern: (?<=[a-z,;)]\s)Open Systems?\b
    suggest: open system
    skip_fields:
    - heading
    - page title
    - menu label
    - Title
    - caption
    - entity name
    - Id
    - concept display
    - diagram line
    - svg text
    - transcribed text
    - artifact group name
    - IG title
    note: Glossary terms are sentence case mid-sentence.
- id: T-PAT
  glossary_term: Patient
  definition: A consumer, or client, who is the subject of care, including assessment, goal identification, referrals,
    and service provision. Use of the term in this IG does not necessarily imply a clinical context.
  rules:
  - id: R-PAT-CANON
    type: canonical
    pattern: \bpatients?\b
  - id: R-PAT-INDIV
    type: missed-use
    pattern: \bindividuals?\b(?!\s+(components?|levels?|elements?|values?|questions?|answers?|items?|fields?|observations?|resources?|codes?|records?|entries|entry|responses?|data|panels?))
    suggest: patient
    decision: D-2
    note: Person reference other than the glossary term.
  - id: R-PAT-PERSON
    type: missed-use
    pattern: (?<!Related\s)\bpersons?\b(?!al)
    suggest: patient
    decision: D-2
  - id: R-PAT-CONSUMER
    type: missed-use
    pattern: \bconsumers?\b
    suggest: patient
    decision: D-2
  - id: R-PAT-SUBJ
    type: missed-use
    pattern: \bsubjects?\s+of\s+care\b
    suggest: patient
    decision: D-2
  - id: R-PAT-CLIENT
    type: missed-use
    pattern: \bclients?\b(?!\s*(systems?|applications?|apps?|side|servers?|software|credentials?|ids?)\b)
    suggest: patient (person sense) — or keep for software
    decision: D-2
    note: '''client'' is used for both the person and REST clients.'
- id: T-PF
  glossary_term: Protective factors
  definition: Characteristics or strengths of individuals, families, communities or societies that act to mitigate
    risks and promote positive well-being and healthy development
  rules:
  - id: R-PF-CANON
    type: canonical
    pattern: \bprotective\s+factors?\b
  - id: R-PF-CASE
    type: form
    case_sensitive: true
    pattern: (?<=[a-z,;)]\s)Protective Factors?\b
    suggest: protective factor
    skip_fields:
    - heading
    - page title
    - menu label
    - Title
    - caption
    - entity name
    - Id
    - concept display
    - diagram line
    - svg text
    - transcribed text
    - artifact group name
    - IG title
    note: Glossary terms are sentence case mid-sentence.
- id: T-PROV
  glossary_term: Provider
  definition: A person such as a licensed provider or qualified professional who interacts with the patient to assess
    social risks, set goals, and determine/recommend referrals.
  rules:
  - id: R-PROV-CANON
    type: canonical
    pattern: \bproviders?\b
  - id: R-PROV-SYSTEM
    type: misuse-signal
    pattern: \bproviders?\b(?=[^.|]{0,60}\b(POSTs?|GETs?|PUTs?|quer(y|ies|ying)|subscri\w*|poll\w*|servers?|endpoints?|APIs?|clones?|proxies|creates?\s+(a\s+)?(Task|ServiceRequest)))
    decision: D-8
    note: 'Glossary: a provider is a person; system actions belong to the referral source''s system.'
  - id: R-PROV-ACTOR
    type: misuse-signal
    pattern: Actor:\s*Provider
    decision: D-8
    note: Diagram labels a system actor 'Provider' (a person per the glossary).
  - id: R-PROV-ORGEX
    type: misuse-signal
    pattern: \bhealth\s*care\s+providers?\b
    decision: D-8
    note: '''Health care provider'' used as the example referral source organization.'
- id: T-PHO
  glossary_term: Public health organization
  definition: An organization that works to create the conditions in which people can live healthy lives, including
    activities to prevent disease and injury and promote health for the population at large. They include governmental
    public health agencies working at local, state, and federal levels, as well as nongovernmental organizations
    that contribute to the performance of core public health functions. A defining feature of public health systems
    is their focus on actions designed to protect and improve health at a population level rather than purely at
    an individual level through the delivery of personal health services.
  rules:
  - id: R-PHO-CANON
    type: canonical
    pattern: \bpublic\s+health\s+organi[sz]ations?\b
  - id: R-PHO-VAR
    type: missed-use
    pattern: \bpublic\s+health\s+(agenc(y|ies)|departments?)\b
    suggest: public health organization
- id: T-RS
  glossary_term: Referral source
  definition: An organizational actor that initiates a referral to address an individual's social risk or protective
    factor (for example, a health care provider; or, in self-referral, the organization operating the community
    resource referral platform the individual uses to refer themselves). It operates the system actor that sends
    the referral and receives its status and results back.
  rules:
  - id: R-RS-CANON
    type: canonical
    pattern: \breferral\s+sources?\b
  - id: R-RS-REFERRING
    type: missed-use
    pattern: \breferring\s+(organi[sz]ations?|providers?|entit(y|ies)|part(y|ies)|systems?|clinicians?)\b
    suggest: referral source
  - id: R-RS-REQUESTER
    type: missed-use
    pattern: \breferral\s+requesters?\b
    suggest: referral source
  - id: R-RS-CASE
    type: form
    case_sensitive: true
    pattern: (?<=[a-z,;)]\s)Referral Sources?\b
    suggest: referral source
    skip_fields:
    - heading
    - page title
    - menu label
    - Title
    - caption
    - entity name
    - Id
    - concept display
    - diagram line
    - svg text
    - transcribed text
    - artifact group name
    - IG title
    note: Glossary terms are sentence case mid-sentence.
- id: T-RT
  glossary_term: Referral target
  definition: An organizational actor that receives a referral requesting a service or assessment (for example,
    a social service organization such as a CBO). It operates the system actor that receives the referral and returns
    its status and results.
  rules:
  - id: R-RT-CANON
    type: canonical
    pattern: \breferral\s+targets?\b
  - id: R-RT-RECIP
    type: missed-use
    pattern: \breferral[\s-]+recipients?\b
    suggest: referral target
    note: Ballot-era synonym; glossary names this role 'referral target'.
  - id: R-RT-BARE
    type: missed-use
    pattern: (?<!referral[\s-])\brecipients?\b
    suggest: referral target
    note: Bare 'recipient' standing for the referral target.
  - id: R-RT-RECEIVING
    type: missed-use
    pattern: \breceiving\s+(organi[sz]ations?|entit(y|ies)|part(y|ies))\b
    suggest: referral target
  - id: R-RT-SVCPROV
    type: missed-use
    pattern: (?<!social\s)\bservice\s+providers?\b
    suggest: referral target
  - id: R-RT-CASE
    type: form
    case_sensitive: true
    pattern: (?<=[a-z,;)]\s)Referral Targets?\b
    suggest: referral target
    skip_fields:
    - heading
    - page title
    - menu label
    - Title
    - caption
    - entity name
    - Id
    - concept display
    - diagram line
    - svg text
    - transcribed text
    - artifact group name
    - IG title
    note: Glossary terms are sentence case mid-sentence.
- id: T-DOMAIN
  glossary_term: SDOH domain
  definition: A high-level classification under which the value sets for specific social risks and protective factors
    are categorized, including but not limited to standardized assessment instruments, diagnoses, goals, and interventions.
    Examples include food insecurity, protective factors, and community access to green space.
  rules:
  - id: R-DOMAIN-CANON
    type: canonical
    pattern: \bSDOH\s+domains?\b
  - id: R-DOMAIN-CAT
    type: missed-use
    pattern: \bSDOH\s+categor(y|ies)\b
    suggest: SDOH domain
    decision: D-5
    note: Same concept as the glossary's SDOH domain; coded element is named 'category'.
  - id: R-DOMAIN-CASE
    type: form
    case_sensitive: true
    pattern: (?<=[a-z,;)]\s)SDOH Domains?\b
    suggest: SDOH domain
    skip_fields:
    - heading
    - page title
    - menu label
    - Title
    - caption
    - entity name
    - Id
    - concept display
    - diagram line
    - svg text
    - transcribed text
    - artifact group name
    - IG title
    note: Glossary terms are sentence case mid-sentence.
- id: T-SCN
  glossary_term: Social care network (SCN)
  definition: An outgrowth of the accountable health communities model, social care networks are coalitions of social
    service, public health, and health care providers and other organizations that are connected through standards-supported
    data exchange to enable sustainable partnerships and efficient, measurable outcomes related to SDOH.
  acronym: SCN
  decision: D-1
  rules:
  - id: R-SCN-CANON
    type: canonical
    pattern: \bsocial\s+care\s+networks?\b|\bSCNs?\b
  - id: R-SCN-CASE
    type: form
    case_sensitive: true
    pattern: (?<=[a-z,;)]\s)Social Care Networks?\b
    suggest: social care network
    skip_fields:
    - heading
    - page title
    - menu label
    - Title
    - caption
    - entity name
    - Id
    - concept display
    - diagram line
    - svg text
    - transcribed text
    - artifact group name
    - IG title
    note: Glossary terms are sentence case mid-sentence.
- id: T-SCP
  glossary_term: Social care program
  definition: 'A structured series of actions and strategies designed to address fundamental human needs and improve
    the well-being of individuals, families, and/or communities. Note: the term and definition for this concept
    are under evaluation and may change in future versions to align with concepts elsewhere in the IG'
  decision: D-1
  rules:
  - id: R-SCP-CANON
    type: canonical
    pattern: \bsocial\s+care\s+programs?\b
  - id: R-SCP-SVC
    type: missed-use
    pattern: \bsocial\s+services?\s+programs?\b
    suggest: social care program
    note: Retired wording (tracked for the FHIR-54902 FSH change).
  - id: R-SCP-CASE
    type: form
    case_sensitive: true
    pattern: (?<=[a-z,;)]\s)Social Care Programs?\b
    suggest: social care program
    skip_fields:
    - heading
    - page title
    - menu label
    - Title
    - caption
    - entity name
    - Id
    - concept display
    - diagram line
    - svg text
    - transcribed text
    - artifact group name
    - IG title
    note: Glossary terms are sentence case mid-sentence.
- id: T-SDOH
  glossary_term: Social determinants of health (SDOH)
  definition: The conditions in which people are born, grow, live, work and age, and people's access to power, money
    and resources (Equivalent to social drivers of health)
  acronym: SDOH
  rules:
  - id: R-SDOH-CANON
    type: canonical
    pattern: \bSDOH\b|\bsocial\s+determinants?\s+of\s+health\b
  - id: R-SDOH-DRIVERS
    type: missed-use
    pattern: \bsocial\s+drivers?\s+of\s+health\b
    suggest: social determinants of health
    note: Glossary lists it as equivalent; the defined term is social determinants of health.
  - id: R-SDOH-CASE
    type: form
    case_sensitive: true
    pattern: (?<=[a-z,;)]\s)Social Determinants? [Oo]f Health\b
    suggest: social determinants of health
    skip_fields:
