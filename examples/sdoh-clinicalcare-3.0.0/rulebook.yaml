- id: T-NEED
  glossary_term: Social need
  definition: Patient-prioritized social risks
  rules:
  - id: R-NEED-CANON
    type: canonical
    pattern: \bsocial\s+needs?\b
  - id: R-NEED-ASRISK
    type: misuse-signal
    pattern: \b(assess|screen|identif|detect|document)\w*[^.|]{0,40}(?<!related\s)\bsocial\s+needs?\b|(?<!related\s)\bsocial\s+needs?\b[^.|]{0,40}\b(assess|screen|identif|detect)\w*
    note: 'Glossary: a social need is a patient-prioritized social risk; identification/assessment language usually
      means social risk.'
  - id: R-NEED-CASE
    type: form
    case_sensitive: true
    pattern: (?<=[a-z,;)]\s)(?<!Related\s)Social Needs?\b
    suggest: social need
    skip_fields:
    - heading
    - page title
