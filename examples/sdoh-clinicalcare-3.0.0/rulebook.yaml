- id: T-SAI
  glossary_term: Standardized assessment instrument
  definition: An evaluation or measurement instrument, often in a scale or questionnaire form, that is valid and
    reliable, and replicable without changes or adaptations in its structure and content.
  rules:
  - id: R-SAI-CANON
    type: canonical
    pattern: \bstandardi[sz]ed\s+assessment\s+instruments?\b
  - id: R-SAI-SCREENTOOL
    type: missed-use
    pattern: (?<!HRSN\s)(?<!Needs\s)\bscreening\s+(tools?|instruments?|questionnaires?)\b
    suggest: standardized assessment instrument
  - id: R-SAI-TOOL
    type: missed-use
    pattern: \bassessment\s+tools?\b|\bstandardi[sz]ed\s+(instruments?|tools?|screening)\b|\bsurvey\s+instruments?\b
    suggest: standardized assessment instrument
  - id: R-SAI-CASE
    type: form
    case_sensitive: true
    pattern: (?<=[a-z,;)]\s)(Standardized )?Assessment Instruments?\b
    suggest: standardized assessment instrument
    skip_fields:
