- id: T-EHR
  glossary_term: Electronic health record system
  definition: A set of technical components — including rules and procedures, processing and storage devices, and
    communication and support facilities — whose core function is to capture, store, retrieve, display, and exchange
    health-related information across authorized users, settings, and systems.
  acronym: EHR
  rules:
  - id: R-EHR-CANON
    type: canonical
    pattern: \belectronic\s+health\s+records?(\s+systems?)?\b|\bEHRs?\b
  - id: R-EHR-EMR
    type: missed-use
    pattern: \bEMRs?\b|\belectronic\s+medical\s+records?\b
    suggest: EHR / electronic health record system
    note: Glossary term is electronic health record system.
- id: T-HCO
  glossary_term: Health care organization
  definition: An organization that provides health care services to individuals, including hospitals, nursing care
    facilities, home health agencies, and clinics. Health care organizations can be organized as governmental, not-for-profit,
    or commercial entities. If the health care entity is financially accountable to a primary government, it could
    be classified as a component unit of the government.
