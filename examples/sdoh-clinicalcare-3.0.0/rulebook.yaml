# Term rulebook for the STU 3.1 glossary alignment analysis.
# Rules flag CANDIDATES (favoring recall); agents judge each hit in context.
# Types: canonical (correct use, counted) | missed-use (variant that should become the term)
#        misuse-signal (likely use against the definition) | form (right term, wrong form).
# Rules carrying a decision are held 'pending' until that D-n item is decided.

version: draft-2 (2026-10-26)
snapshot: IG tag 3.0.0
identifier_decision: D-10
domain_notes: |
  System actions. Only two kinds of system action count as Misuse: one done by the intermediary (that belongs
  to its coordination platform) and one done by a provider (that belongs to the referral source's system;
  decision D-8). The glossary names no system actor for the referral source or referral target. So when they
  "send", "query", "populate" or "return" something, leave the text alone. Don't rewrite it as "the referral
  target's system". If it seems worth raising, add one glossary_feedback note for the pattern rather than a
  finding per sentence.

  "Requester", "performer", "owner". Bare, these usually name a FHIR role (Task.requester, Task.owner): leave
  them. Change one to "referral source" or "referral target" only when it is clearly shorthand for a referral
  requester or recipient named earlier in the same paragraph. Mark those Medium.

  Linking terms to the glossary is decision D-3 and is not a finding.
decisions:
- id: D-1
  title: Social care vs social services
  question: The glossary names 'Social care program' and 'Social care network (SCN)' and uses 'social care service'
    in the Capacity definition; an alternative is 'social services / social service providers'. What does 3.1
    propagate?
  options:
  - 'A: Propagate the glossary as written (''social care'' wording stays)'
  - 'B: Revise the glossary terms to ''social service(s)'' wording first, then propagate'
  - 'C: Keep the two defined term names for 3.1; use ''social services'' wherever prose says ''social care'' generically'
  recommendation: C — defined terms carry citations and can be renamed deliberately later; generic prose can move
    now without touching them.
- id: D-2
  title: Patient vs person / individual / client
  question: The glossary defines Patient broadly ('a consumer, or client, who is the subject of care … does not
    necessarily imply a clinical context'). Strictly applied, every 'individual' (~156), 'person' (~62), 'consumer'
    and person-sense 'client' becomes a missed use of 'patient' — but the self-referral and enrollment pages use
    'person', and 'client' already means software in ~40 places.
  options:
  - 'A: Standardize on ''patient'' everywhere (strict glossary)'
  - 'B: ''Patient'' for the FHIR Patient and clinical workflows; ''person''/''individual'' allowed in self-referral
    and social-service contexts; ''client'' reserved for software — and revise the Patient definition to match'
  - 'C: Leave person-reference wording as-is for 3.1'
  recommendation: B — it matches how the guide already reads in self-referral/enrollment and removes the 'client'
    double meaning; needs a one-line glossary edit.
- id: D-3
  title: Link first use of glossary terms
  question: No page links glossary terms to the glossary. Should 3.1 link the first use of each glossary term on
    each page?
  options:
  - 'A: Yes — first use per page'
  - 'B: Only the referral-actor terms (source, target, intermediary, CP, direct/indirect referral)'
  - 'C: No links'
  recommendation: A — cheap, mechanical, and makes every later wording fix land with its definition one click away.
- id: D-4
  title: HRSN vs social risk
  question: The glossary says Social risk is 'equivalent to health-related social needs, or HRSN'. The guide uses
    'HRSN' ~62 times (mostly the assessment-instrument page) and 'health-related social need(s)' ~15 times.
  options:
  - 'A: Replace HRSN with ''social risk'' throughout'
  - 'B: Use ''social risk'' in the guide''s own prose; keep ''HRSN'' only inside external proper names (e.g., the
    AHC HRSN Screening Tool) and note the equivalence on first use'
  - 'C: Keep HRSN; add it to the glossary as a synonym entry'
  recommendation: B — honors the glossary while leaving CMS program/instrument names intact.
- id: D-5
  title: SDOH domain vs SDOH category
  question: The glossary defines 'SDOH domain'; FHIR artifacts code the same idea as 'SDOH category' (Condition.category,
    the SDOH Category value set and code displays — identifiers). Prose uses 'SDOH domain' ~64 times and 'SDOH category'
    ~103.
  options:
  - 'A: ''SDOH domain'' for the concept in prose; ''SDOH category'' only when naming the coded element or value
    set — and add that sentence to the glossary entry'
  - 'B: Adopt ''SDOH category'' everywhere and revise the glossary term'
  - 'C: Treat them as synonyms; no change'
  recommendation: A — keeps the glossary term, explains the artifact naming, and avoids breaking identifiers.
- id: D-6
  title: CBO vs social service organization (how far to propagate)
  question: STU 3.0 introduced 'social service organization' as the inclusive term and its index STU note deferred
    broader adoption to future versions. 'CBO' still appears ~197 times, usually as the generic referral target.
  options:
  - 'A: Use ''social service organization'' wherever the generic referral target is meant; keep ''CBO'' only where
    community-based specifically is meant or in named examples; update diagrams together'
  - 'B: Keep CBO as the illustrative referral target for 3.1'
  - 'C: Swap every CBO'
  recommendation: A — completes the STU-note pivot, which is exactly the propagation 3.1 is for; B leaves the note's
    promise unmet.
- id: D-7
  title: '''Screening'' as an activity word'
  question: The glossary has no 'screening' entry; STU 3.0 moved to 'standardized assessment instrument'. 'Screening'
    still appears ~119 times — some in artifact names (Observation Screening Response profile, LOINC panel names),
    most in the guide's own prose.
  options:
  - 'A: Replace ''screening'' in the guide''s own prose with ''assessment'' / ''standardized assessment instrument'';
    leave artifact and external names'
  - 'B: Keep ''screening'' where it describes the clinical activity; only fix ''screening tool/instrument'''
  - 'C: No change'
  recommendation: A — consistent with the STU 3.0 terminology shift; names are reported, not changed.
- id: D-8
  title: 'Provider: person or organization?'
  question: 'The glossary defines Provider as a person, but its own Referral source, Direct referral and Indirect
    referral entries use ''health care provider'' as the example organization, and diagrams label the referral source
    system ''Actor: Provider''.'
  options:
  - 'A: Keep Provider = person; change organization examples to ''health care organization'' (glossary + prose +
    diagram actor labels)'
  - 'B: Broaden the Provider definition to include organizations'
  - 'C: Leave as-is'
  recommendation: A — the glossary already defines Health care organization; this removes a self-contradiction.
- id: D-9
  title: 'Glossary gaps: heavily used concepts with no entry'
  question: 'Several concepts are used throughout the guide but have no glossary entry (counts in the N- entries
    below): referral, self-referral, intervention, health information exchange (HIE), EHR as an acronym, SDOH category,
    HRSN, and ''assessment instrument'' (the guide also defines non-standardized instruments, so the unqualified
    phrase is a broader concept than the glossary term).'
  options:
  - 'A: Add entries for referral, self-referral, and intervention; add see-also notes for SDOH category and HRSN'
  - 'B: Add all listed'
  - 'C: No new entries in 3.1'
  recommendation: A — the referral concepts are core to the guide; the rest are better handled as notes on existing
    entries.
- id: D-10
  title: Identifier-level misalignments
  question: 'Some artifact names and ids embed retired or non-glossary wording: the SDOHCC Referral Recipient CapabilityStatements,
    the SDOHCC Observation Screening Response profile, the SDOH Category code system. Renaming is a breaking change.
    Changing only the titles is non-breaking, but a changed artifact title needs a matching pull request to
    HL7/JIRA-Spec-Artifacts (the dry run''s only new QA warning).'
  options:
  - 'A: Do not rename in 3.1; align titles/descriptions where non-breaking and explain the legacy names once (e.g.,
    in an STU note)'
  - 'B: Rename now with redirects/versioning'
  - 'C: Leave entirely'
  recommendation: A — keeps 3.1 non-breaking while making the mismatch visible to implementers.
# D-11..D-13 come from the reading agents' glossary feedback (Part 2); no finding is gated on them.
- id: D-11
  title: No system actor for the referral source and referral target
  question: 'The glossary names a system actor only for the intermediary (its coordination platform). The referral
    source and referral target are organizations, so pages, diagrams and all four CapabilityStatements give them system
    actions (''the referral target populates ... and returns it'') or invent names (''service delivery system'',
    ''a fulfilling system''). Raised independently by 8 of the 12 reading batches; no findings were written for it.'
  options:
  - 'A: Add a glossary note that in technical artifacts (CapabilityStatements, diagrams, conformance statements) the
    role names stand for the system each organization operates'
  - 'B: Define system-actor terms for both sides (e.g., referral source system, referral target system) and use them
    wherever a system acts'
  - 'C: Leave as-is'
  recommendation: A — one sentence settles hundreds of sentences without rewriting normative text; B is cleaner but
    touches most SHALL/SHOULD statements in the CapabilityStatements.
- id: D-12
  title: Referral definitions vs light targets and chained referrals
  question: 'The Direct and Indirect referral entries require every party to have a FHIR server API, so the guide''s
    Direct/Indirect Referral Light use cases (a referral target with only a FHIR client app) fit neither definition. The
    guide also describes chained referrals (a referral target that onward-refers, coordination platforms chained to each
    other), while the glossary treats referral source and target as fixed roles and the CP entry covers only routing
    from health care to social service organizations.'
  options:
  - 'A: Loosen the Direct/Indirect referral definitions to cover light targets, and add a note that source/target roles
    are assigned per referral'
  - 'B: Add separate entries for the light variants and for chained referrals'
  - 'C: Leave the definitions as written'
  recommendation: A — the light use cases are first-class workflows in the guide; a definition that excludes them
    misleads implementers.
- id: D-13
  title: What 'standardized' means for an assessment instrument
  question: 'Tables 2 and 3 on the assessment instrument page treat ''standardized'' as ''LOINC-encoded'' (an instrument
    not in LOINC is ''non-standardized''). The glossary defines a standardized assessment instrument by validity,
    reliability and replicability, with no mention of LOINC, so a validated instrument not yet in LOINC is standardized
    by the glossary but non-standardized by the tables. The unqualified ''assessment instrument'' the guide also needs has
    no entry (see D-9).'
  options:
  - 'A: Keep the glossary definition; relabel the tables'' axis as LOINC-encoded vs not'
  - 'B: Add LOINC encoding to the glossary definition'
  - 'C: Leave as-is'
  recommendation: A — the glossary follows the field's meaning of 'standardized'; LOINC encoding is a separate property.
terms:
- id: T-ACH
  glossary_term: Accountable community for health
  definition: A multisector, community-based partnership that brings together health care, public health, social
    services, other local partners, and residents to address the unmet health and social needs of the individuals
    and communities they serve
  rules:
  - id: R-ACH-CANON
    type: canonical
    pattern: \baccountable\s+communit(y|ies)\s+for\s+health\b|\bACHs?\b
- id: T-BA
  glossary_term: Business associate
  definition: A person or entity that performs certain functions or activities that involve the use or disclosure
    of protected health information on behalf of, or provides services to, a covered entity. A member of the covered
    entity's workforce is not a business associate.
  rules:
  - id: R-BA-CANON
    type: canonical
    pattern: \bbusiness\s+associates?\b
  - id: R-BA-CASE
    type: form
    case_sensitive: true
    pattern: (?<=[a-z,;)]\s)Business Associates?\b
    suggest: business associate
    skip_fields:
    - heading
    - page title
    - menu label
    - Title
    - caption
    - entity name
    - Id
    - concept display
    - diagram line
    - svg text
    - transcribed text
    - artifact group name
    - IG title
    note: Glossary terms are sentence case mid-sentence.
- id: T-CAP
  glossary_term: Capacity
  definition: A social service organization's (e.g., a CBO's) ability to accept and serve a new individual for a
    social care service it offers. In this guide, capacity is a point-in-time judgment of whether the social service
    organization can take on a new referral for that service. It is an assessment of general operational bandwidth,
    separate from whether an individual ultimately meets specific eligibility criteria or has complex needs that
    require a more detailed intake review.
  rules:
  - id: R-CAP-CANON
    type: canonical
    pattern: \bcapacity\b(?!\s+status)
  - id: R-CAP-OTHER
    type: misuse-signal
    pattern: \bin\s+(the|their|a|an|its|this)\s+capacity\b|\bcapacity\s+as\b
    note: '''capacity'' in a different sense (role) next to the defined term; may confuse.'
  - id: R-CAP-AVAIL
    type: missed-use
    pattern: \bavailability\b
    suggest: capacity
    note: May mean the defined concept.
- id: T-CAPS
  glossary_term: Capacity status
  definition: A standardized, coded indicator reflecting whether a social service organization (e.g., a CBO) currently
    has the operational bandwidth to receive and review new referrals for a specific service. A status of "has capacity"
    signals to referring sources that the program is open to new requests, but does not guarantee individual eligibility,
    a perfect match for complex needs, or immediate enrollment. See the SDOHCC Capacity Status value set for the
    allowed states.
  rules:
  - id: R-CAPS-CANON
    type: canonical
    pattern: \bcapacity\s+status(es)?\b
  - id: R-CAPS-CASE
    type: form
    case_sensitive: true
    pattern: (?<=[a-z,;)]\s)Capacity Status(es)?\b
    suggest: capacity status
    skip_fields:
    - heading
    - page title
    - menu label
    - Title
    - caption
    - entity name
    - Id
    - concept display
    - diagram line
    - svg text
    - transcribed text
    - artifact group name
    - IG title
    note: Glossary terms are sentence case mid-sentence.
- id: T-CC
