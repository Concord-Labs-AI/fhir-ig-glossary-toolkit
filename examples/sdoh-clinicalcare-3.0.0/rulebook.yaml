- id: T-CBO
  glossary_term: Community-based organization (CBO)
  definition: A public or private nonprofit organization that is representative of a community or a significant
    segment of a community and works to meet community needs. Ideally, Community-Based Organizations are driven
    by community residents in all aspects, aligned with the principles of the National Community-Based Organization
    Network.
  acronym: CBO
  rules:
  - id: R-CBO-CANON
    type: canonical
    pattern: \b[Cc]ommunity-based [Oo]rgani[sz]ations?\b|\bCBOs?\b
    case_sensitive: true
  - id: R-CBO-HYPHEN
    type: form
    pattern: \bcommunity\s+based\b
    suggest: community-based
    note: Glossary spells the term hyphenated.
  - id: R-CBO-CASE
    type: form
    case_sensitive: true
    pattern: (?<=[a-z,;)]\s)Community[\s-]Based Organi[sz]ations?\b
    suggest: community-based organization
